name: Mercanis
description: 'Mercanis is an AI-powered procurement platform that automates the end-to-end
  source-to-contract lifecycle for enterprise procurement teams. It combines structured
  intake, connected sourcing (RFx and supplier comparison), supplier relationship management,
  contract lifecycle management, and risk, compliance and spend analytics, coordinated
  by a large fleet of autonomous AI agents. Mercanis serves sectors including energy
  and utilities, pharma and chemicals, automotive, consumer goods, manufacturing, and
  construction, and integrates with ERP systems such as SAP and NetSuite alongside procurement
  networks like Unite. The company is headquartered in Germany with SOC-certified, GDPR-compliant
  infrastructure. No public developer API, documentation, or /.well-known discovery surface
  has been identified as of this enrichment pass.'
